; Waveshare Pico-Relay-B (SKU 20218) — USB CDC 8 路繼電器控制器
;
; 用途：給 Orange Pi 5+ 當治具 I/O。主機以 USB CDC 下 ASCII 行指令控制 8 路繼電器。
; 協定：docs/PROTOCOL.md
;
; 燒錄：pio run -t upload   （第一次請按住 BOOTSEL 插 USB）
; 監看：pio device monitor  （可直接手打指令除錯，例如 ON 1）

[env:rpipico]
platform = git+https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; 不用檔案系統，整個 2MB 都給韌體。
board_build.filesystem_size = 0M

; USB 描述字串：主機端 udev / pyserial 靠 product 字串 + 序號（= Pico flash
; unique ID，韌體 ID 指令會回報同一組）認治具，多台並接不會抓錯 /dev/ttyACM*。
board_build.arduino.earlephilhower.usb_manufacturer = Waveshare
board_build.arduino.earlephilhower.usb_product = Pico-Relay-B

; 8 路 SRD-05VDC 線圈各約 70mA，全開 ≈ 600mA。板子定義預設只宣告 250mA，
; 這裡改成 500mA 讓主機／hub 正確分配電流預算（實測仍建議用帶外部供電的 hub）。
build_unflags = -DUSBD_MAX_POWER_MA=250
build_flags =
    -DUSBD_MAX_POWER_MA=500
    -Wall

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

monitor_speed = 115200
monitor_filters = send_on_enter, default
monitor_eol = LF
